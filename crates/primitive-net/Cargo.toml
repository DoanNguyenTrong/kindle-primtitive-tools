[package]
name = "primitive-net"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only OR PolyForm-Noncommercial-1.0.0"
description = "HTTPS downloads for PrimitiveOS apps with host checks, size limits, progress and verified resume."

[dependencies]
# The same HTTP client as Primitive Browser (rustls, no default features), so the offline crate cache has it.
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"
