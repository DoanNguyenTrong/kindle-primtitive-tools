[package]
name = "kl-kindle"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The shared Kindle SDK and the launcher and Store event adapters."

[dependencies]
kl-store = { path = "../kl-store" }
kl-core = { path = "../kl-core" }
primitive-device = { path = "../primitive-device" }
primitive-eink = { path = "../primitive-eink" }
primitive-input = { path = "../primitive-input" }
libc.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
